<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>राष्ट्रिय स्वतन्त्र पार्टी (रास्वपा) - Candidate MCQ Platform</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Color Science & High-End RSP Theme */
            --bg-deep: #030712;
            --primary-navy: #0F172A;
            --rsp-blue: #1E40AF;
            --rsp-vibrant: #2563EB;
            --rsp-cyan: #06B6D4;
            --neon-glow: rgba(37, 99, 235, 0.4);
            
            --glass-bg: rgba(15, 23, 42, 0.88);
            --glass-card: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;

            --skip-bg: rgba(245, 158, 11, 0.15);
            --skip-border: #F59E0B;
            --skip-text: #FBBF24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fireworks Overlay Canvas */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        /* Ambient Background Floating Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.25;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }
        body::before { background: var(--rsp-vibrant); top: -50px; left: -50px; }
        body::after { background: var(--rsp-cyan); bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Master Glassmorphic Container with Background Rectangular Image (rsp.jpg) */
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(37, 99, 235, 0.15);
            padding: 35px 25px;
            text-align: center;
            position: relative;
            z-index: 10;
            overflow: hidden;
            animation: containerEntry 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Top Centre Rectangular Background Banner Image Overlay */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 200px;
            background: url('rsp.jpg') no-repeat center top;
            background-size: cover;
            opacity: 0.35; 
            z-index: 0;
            pointer-events: none;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }

        .container > * { position: relative; z-index: 2; }

        @keyframes containerEntry {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Party Name Color Animation (Red & Blue Science) */
        .animated-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #EF4444 0%, #3B82F6 50%, #EF4444 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: redBlueShine 4s linear infinite;
            letter-spacing: -0.5px;
        }

        @keyframes redBlueShine { to { background-position: 200% center; } }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--rsp-cyan);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            opacity: 0.9;
        }

        /* Profile Photo */
        .profile-container {
            margin: 22px auto;
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--rsp-vibrant), var(--rsp-cyan));
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.4);
            animation: profileGlow 4s ease-in-out infinite alternate;
        }
        @keyframes profileGlow {
            0% { transform: translateY(0); box-shadow: 0 0 20px rgba(37, 99, 235, 0.3); }
            100% { transform: translateY(-6px); box-shadow: 0 0 35px rgba(6, 182, 212, 0.6); }
        }
        .profile-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background: #111; }

        /* Social Links */
        .social-quick-links { display: flex; justify-content: center; gap: 14px; margin-bottom: 25px; }
        .social-btn {
            padding: 10px 20px; font-size: 0.85rem; font-weight: 700; border-radius: 50px;
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s ease;
        }
        .fb-btn { background: linear-gradient(135deg, #2563EB, #1D4ED8); }
        .wa-btn { background: linear-gradient(135deg, #059669, #047857); }
        .social-btn:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5); }

        /* Main Menu Buttons */
        .menu-grid { display: flex; flex-direction: column; gap: 14px; }
        .menu-btn {
            width: 100%; padding: 18px 22px; background: var(--glass-card); color: var(--text-main);
            border: 1px solid var(--glass-border); border-radius: 20px; font-size: 1.02rem; font-weight: 700;
            cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); transition: all 0.35s ease; position: relative; overflow: hidden;
        }
        .menu-btn::before {
            content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
            background: linear-gradient(to bottom, var(--rsp-vibrant), var(--rsp-cyan)); transition: width 0.3s ease;
        }
        .menu-btn:hover {
            transform: translateX(6px); background: rgba(255, 255, 255, 0.08);
            border-color: var(--rsp-vibrant); box-shadow: 0 12px 30px rgba(37, 99, 235, 0.3);
        }
        .menu-btn:hover::before { width: 10px; }
        .menu-btn i { color: var(--rsp-cyan); transition: transform 0.3s ease; }
        .menu-btn:hover i { transform: translateX(4px); }

        /* Coming Soon Button (Bottom of Home Screen) */
        .coming-soon-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-top: 25px; padding: 16px 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; color: #F8FAFC; text-decoration: none; font-weight: 800; font-size: 1.15rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset 0 0 15px rgba(255,255,255,0.05);
            transition: all 0.35s ease; position: relative; overflow: hidden; width: 100%; cursor: pointer;
        }
        .coming-soon-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: skewX(-20deg); animation: shineSweep 3.5s infinite;
        }
        @keyframes shineSweep { 100% { left: 200%; } }
        .coming-soon-btn:hover {
            transform: translateY(-4px); background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 25px rgba(6, 182, 212, 0.4); border-color: var(--rsp-cyan);
        }
        .coming-soon-btn .small-text { font-size: 0.8rem; font-weight: 500; color: var(--rsp-cyan); margin-top: 4px; letter-spacing: 1px;}
        .coming-soon-btn i { margin-right: 8px; color: var(--rsp-vibrant); }

        /* Screens */
        .screen { display: none; text-align: left; }
        .screen.active { display: block; animation: fadeInScreen 0.4s ease forwards; }
        @keyframes fadeInScreen { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .back-btn {
            background: none; border: none; color: #60A5FA; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            margin-bottom: 20px; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.2s;
        }
        .back-btn:hover { transform: translateX(-4px); }

        /* Bright Longitudinal Mode Buttons */
        .mode-selection { display: flex; flex-direction: column; gap: 18px; margin-top: 25px; }
        .bright-btn {
            width: 100%; padding: 22px 20px; border-radius: 20px; border: none; color: white; font-size: 1.1rem;
            font-weight: 800; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center;
            gap: 12px; transition: all 0.35s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .bright-btn.practice-btn { background: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%); }
        .bright-btn.mistake-btn { background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); }
        .bright-btn:hover { transform: translateY(-4px) scale(1.02); filter: brightness(1.15); box-shadow: 0 15px 35px rgba(37, 99, 235, 0.5); }
        .badge-count { background: rgba(255, 255, 255, 0.25); padding: 4px 12px; border-radius: 30px; font-size: 0.9rem; font-weight: 800; backdrop-filter: blur(5px); }

        /* Quiz UI (Pure Glassmorphism) */
        .quiz-box {
            margin-top: 5px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px; padding: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .quiz-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .skip-btn {
            padding: 8px 18px; background: var(--skip-bg); border: 1px solid var(--skip-border); color: var(--skip-text);
            font-weight: 700; font-size: 0.88rem; border-radius: 12px; cursor: pointer; transition: all 0.2s ease;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .skip-btn:hover { background: var(--skip-border); color: #000; transform: translateY(-2px); }

        .progress-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.95rem;
            color: var(--text-muted); font-weight: 700; background: rgba(255,255,255,0.03); padding: 12px 18px;
            border-radius: 14px; border: 1px solid var(--glass-border);
        }

        /* Highly Highlighted Question Text */
        .question-text {
            font-size: 1.25rem; font-weight: 700; margin-bottom: 25px; color: #FFFFFF; line-height: 1.6;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(6, 182, 212, 0.1));
            padding: 22px; border-radius: 18px; border-left: 6px solid var(--rsp-cyan);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2), inset 0 0 15px rgba(255,255,255,0.05);
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .options-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
        
        /* Subtle Options Background */
        .option-item {
            padding: 18px 22px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 1rem; color: var(--text-main);
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .option-item:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.08); border-color: var(--rsp-cyan); transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Bright Clicked Options */
        .option-item.correct {
            background: #10B981 !important; /* Bright Emerald Green */
            border-color: #059669 !important;
            color: #FFFFFF !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6) !important;
            font-weight: 800; transform: scale(1.02);
        }
        .option-item.wrong {
            background: #EF4444 !important; /* Bright Crimson Red */
            border-color: #B91C1C !important;
            color: #FFFFFF !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6) !important;
            font-weight: 800; transform: scale(1.02);
        }

        .option-item.disabled { cursor: default; }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px; padding: 16px 20px; background: rgba(6, 182, 212, 0.15);
            border-left: 5px solid var(--rsp-cyan); border-radius: 12px; font-size: 0.95rem; color: #A5F3FC;
            line-height: 1.5; display: none; box-shadow: inset 0 0 10px rgba(6, 182, 212, 0.1);
        }

        .quiz-footer { margin-top: 25px; display: flex; justify-content: flex-end; }
        .next-q-btn {
            padding: 14px 28px; background: linear-gradient(135deg, var(--rsp-vibrant), var(--rsp-cyan)); color: white;
            border: none; border-radius: 14px; font-weight: 800; font-size: 1rem; cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); display: none; transition: all 0.3s ease;
        }
        .next-q-btn:hover { transform: translateY(-2px) scale(1.05); filter: brightness(1.2); }

        /* Analytical Result Dashboard */
        .result-card { text-align: center; padding: 15px 5px; }
        .accuracy-ring {
            position: relative; width: 140px; height: 140px; margin: 15px auto; border-radius: 50%;
            background: conic-gradient(var(--rsp-cyan) calc(var(--accuracy) * 1%), rgba(255,255,255,0.1) 0);
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
        }
        .accuracy-ring::before { content: ''; position: absolute; width: 110px; height: 110px; border-radius: 50%; background: var(--primary-navy); }
        .accuracy-value { position: relative; font-size: 2rem; font-weight: 800; color: var(--rsp-cyan); }
        .score-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 20px 0; }
        .stat-card {
            padding: 15px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            font-weight: 700; text-align: center; backdrop-filter: blur(10px);
        }
        .stat-card.correct-stat { border-color: #10B981; color: #10B981; }
        .stat-card.wrong-stat { border-color: #EF4444; color: #EF4444; }
        .stat-card.skip-stat { border-color: var(--skip-border); color: var(--skip-text); }
        .stat-card.total-stat { border-color: var(--rsp-cyan); color: var(--rsp-cyan); }
        .stat-card .num { font-size: 1.8rem; display: block; margin-bottom: 2px; }
        .result-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
    </style>
</head>
<body>

    <!-- Fireworks Canvas Overlay -->
    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <!-- Home Screen -->
        <div id="homeScreen" class="screen active">
            <h1 class="animated-title">राष्ट्रिय स्वतन्त्र पार्टी (रास्वपा)</h1>
            <div class="subtitle">RSP - Candidate Club</div>

            <!-- Profile Circle (photo.jpg) -->
            <div class="profile-container">
                <img src="photo.jpg" alt="RSP Logo" onerror="this.src='https://via.placeholder.com/120/0F172A/FFFFFF?text=RSP'">
            </div>

            <!-- Social Media Buttons -->
            <div class="social-quick-links">
                <a href="https://www.facebook.com/share/19jukwmBco/" target="_blank" class="social-btn fb-btn">
                    <i class="fab fa-facebook-f"></i> Follow Page
                </a>
                <a href="https://chat.whatsapp.com/GaitPAX7C45I6XAlY8RyQG?s=cl&p=a&mlu=4&ilr=4&iam=2" target="_blank" class="social-btn wa-btn">
                    <i class="fab fa-whatsapp"></i> Join WhatsApp

            <!-- 4 Main Menu Buttons -->

                <button class="menu-btn" onclick="openSection(2)">
                    <span>वडा अध्यक्षको जिम्मेवारी</span>

                <button class="menu-btn" onclick="openSection(3)">

                <button class="menu-btn" onclick="openSection(4)">

            <!-- Coming Soon / External GitHub Redirect Button -->

                <span><i class="fas fa-rocket"></i> Coming Soon</span>

            </a>

        </div>

        <!-- Mode Selection Screen (2 Bright Longitudinal Buttons) -->
        <div id="modeScreen" class="screen">
            <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> गृहपृष्ठमा फर्कनुहोस्</button>
            <h2 id="sectionTitle" style="color: var(--text-main); margin-bottom: 6px; font-size: 1.3rem;">विभाग</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">अभ्यास मोड छान्नुहोस्:</p>
            
            <div class="mode-selection">
                <button class="bright-btn practice-btn" onclick="startQuiz('all')">
                    <i class="fas fa-bolt"></i> Practice Important Questions
                </button>

                    <i class="fas fa-fire"></i> Mistake Bank 
                    <span id="mistakeCountBadge" class="badge-count">0</span>
                </button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-top-bar">
                <button class="back-btn" style="margin-bottom:0;" onclick="backToMode()"><i class="fas fa-arrow-left"></i> फर्कनुहोस्</button>
                <button class="skip-btn" onclick="skipQuestion()"><i class="fas fa-forward"></i> Skip Question</button>
            </div>
            
            <div class="quiz-box" id="quizBoxContent">
                <div class="progress-header">
                    <span id="quizProgress">प्रश्न १ / १०</span>
                    <span id="scoreTracker" style="color: var(--rsp-cyan);">सही: 0</span>

                <div class="question-text" id="questionText">प्रश्न लोड हुँदैछ...</div>

                <div class="quiz-footer">
                    <button class="next-q-btn" id="nextBtn" onclick="nextQuestion()">अर्को प्रश्न <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
        </div>

    <script>
        /* -------------------------------------------------------------
           1. WEB AUDIO API SYNTHESIZER
           ------------------------------------------------------------- */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCorrectSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now);
                osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.35);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(783.99, now + 0.1);
                gain2.gain.setValueAtTime(0.25, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.45);
            } catch (e) { }
        }

        function playWrongSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.3);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } catch (e) { }
        }

        function playFirecrackerPop() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const bufferSize = audioCtx.sampleRate * 0.08;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800 + Math.random() * 1200, now);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } catch (e) { }
        }

        /* -------------------------------------------------------------
           2. FIREWORKS OPENING CEREMONY ANIMATION (One-Time Run)
           ------------------------------------------------------------- */
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let fireworksActive = true;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.vy += 0.08; this.alpha -= this.decay;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.restore();
            }
        }

        function createFirework(x, y) {
            const colors = ['#2563EB', '#06B6D4', '#EF4444', '#F59E0B', '#10B981', '#EC4899'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 35; i++) { particles.push(new Particle(x, y, color)); }
            playFirecrackerPop();
        }

        let lastLaunch = 0;
        function animateFireworks(timestamp) {
            if (!fireworksActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (timestamp - lastLaunch > 250) {
                createFirework(
                    Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
                    Math.random() * canvas.height * 0.5 + canvas.height * 0.1
                );
                lastLaunch = timestamp;
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateFireworks);
        }

        window.addEventListener('load', () => {
            requestAnimationFrame(animateFireworks);
            setTimeout(() => {
                fireworksActive = false;
                canvas.style.opacity = '0';
                setTimeout(() => canvas.style.display = 'none', 1000);
            }, 3000);
        });

        /* -------------------------------------------------------------
           3. APP STATE & MISTAKE BANK LOGIC
           ------------------------------------------------------------- */
        let currentSection = 1;
        let currentMode = 'all';
        let questionsData = [];
        let activeQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let skipCount = 0;
        let answeredCurrent = false;

        const fallbackQuestions = {
            1: [
                { id: 101, q: "१. स्थानीय सरकार सञ्चालन ऐन, २०७४ नेपालको संविधानको कुन धारा बमोजिम बनेको हो?", o: ["धारा २९५ उपधारा (३)", "धारा २९६ उपधारा (१)", "धारा २१७", "धारा २२७"], a: 1, e: "संविधानको धारा २९६ (१) बमोजिमको व्यवस्थापिका-संसदले यो ऐन बनाएको हो।" },
                { id: 102, q: "२. 'गाउँ सभा' भन्नाले संविधानको कुन धारा बमोजिमको गाउँ सभा सम्झनु पर्छ?", o: ["धारा २२० (१)", "धारा २२२ (१)", "धारा २२३ (१)", "धारा २१७"], a: 1, e: "धारा २२२ (१) ले गाउँ सभाको गठन सम्बन्धी व्यवस्था गरेको छ।" }
            ],
            2: [
                { id: 201, q: "१. वडा समितिको मुख्य कार्य कुन हो?", o: ["वडास्तरीय विकास योजना तर्जमा", "विदेश नीति निर्माण", "केन्द्रीय बजेट स्वीकृति", "अदालती निर्णय"], a: 0, e: "वडा समितिको प्राथमिक जिम्मेवारी स्थानीय वडाको विकास निर्माण योजना बनाउनु हो।" }
            ],
            3: [
                { id: 301, q: "१. कार्यपालिका प्रमुखको मुख्य जिम्मेवारी के हो?", o: ["सभाको बैठक बोलाउने र सञ्चालन गर्ने", "मुद्दा मामिला छिन्नु", "कानुन निर्माण मात्र", "कुनै पनि होइन"], a: 0 }
            ],
            4: [
                { id: 401, q: "१. नेपालको वर्तमान संविधान कहिले जारी भयो?", o: ["२०७२ असोज ३", "२०६३ माघ १", "२०७० मंसिर ४", "२०७४ वैशाख ३१"], a: 0 }
            ]
        };

        function getMistakeKey(sec) { return `rsp_mistakes_sec_${sec}`; }
        function getStoredMistakes(sec) { let data = localStorage.getItem(getMistakeKey(sec)); return data ? JSON.parse(data) : []; }
        function storeMistake(sec, qId) {
            let mistakes = getStoredMistakes(sec);
            if (!mistakes.includes(qId)) { mistakes.push(qId); localStorage.setItem(getMistakeKey(sec), JSON.stringify(mistakes)); }
        }
        function removeMistake(sec, qId) {
            let mistakes = getStoredMistakes(sec);
            mistakes = mistakes.filter(id => id !== qId); localStorage.setItem(getMistakeKey(sec), JSON.stringify(mistakes));
        }

        function updateMistakeBadge() {
            let count = getStoredMistakes(currentSection).length;
            document.getElementById('mistakeCountBadge').innerText = count;
        }

        function openSection(sectionNum) {
            initAudio();
            currentSection = sectionNum;
            const titles = { 1: "स्थानीय सरकार सञ्चालन ऐन २०७४", 2: "वडा अध्यक्षको जिम्मेवारी", 3: "प्रमुख / उपप्रमुखको जिम्मेवारी", 4: "नेपालको संविधान २०७२" };
            document.getElementById('sectionTitle').innerText = titles[sectionNum];
            updateMistakeBadge();
            
            fetch(`data/${sectionNum}.json`)
                .then(res => { if (!res.ok) throw new Error("JSON file missing"); return res.json(); })
                .then(data => { questionsData = data; switchScreen('modeScreen'); })
                .catch(err => { questionsData = fallbackQuestions[sectionNum] || fallbackQuestions[1]; switchScreen('modeScreen'); });
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() { switchScreen('homeScreen'); }
        function backToMode() { updateMistakeBadge(); switchScreen('modeScreen'); }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz(mode) {
            currentMode = mode; currentIndex = 0; correctCount = 0; wrongCount = 0; skipCount = 0;
            if (mode === 'all') { activeQuestions = shuffleArray(questionsData); } 
            else {
                let mistakeIds = getStoredMistakes(currentSection);
                let filtered = questionsData.filter(q => mistakeIds.includes(q.id));
                activeQuestions = shuffleArray(filtered);
                if (activeQuestions.length === 0) { alert("बधाई छ! तपाईँको Mistake Bank मा कुनै प्रश्न बाँकी छैनन्।"); return; }
            }
            switchScreen('quizScreen'); loadQuestion();
        }

        function loadQuestion() {
            answeredCurrent = false;
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('explanationBox').style.display = "none";

            if (currentIndex >= activeQuestions.length) { renderDashboardResults(); return; }

            let q = activeQuestions[currentIndex];
            document.getElementById('quizProgress').innerText = `प्रश्न ${currentIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('scoreTracker').innerText = `सही: ${correctCount}`;
            document.getElementById('questionText').innerText = q.q;

            let optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = "";
            q.o.forEach((opt, index) => {
                let li = document.createElement('li'); li.className = 'option-item'; li.innerText = opt;
                li.onclick = () => selectOption(index, q.a, q.e, li); optionsList.appendChild(li);
            });
        }

        function selectOption(selectedIndex, correctIndex, explanationText, element) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            let items = document.querySelectorAll('.option-item');
            items.forEach(item => item.classList.add('disabled'));

            if (selectedIndex === correctIndex) {
                element.classList.add('correct'); playCorrectSound(); correctCount++;
                removeMistake(currentSection, activeQuestions[currentIndex].id);
            } else {
                element.classList.add('wrong'); items[correctIndex].classList.add('correct');
                playWrongSound(); wrongCount++;
                storeMistake(currentSection, activeQuestions[currentIndex].id);
            }

            document.getElementById('scoreTracker').innerText = `सही: ${correctCount}`;
            if (explanationText) {
                let expBox = document.getElementById('explanationBox');
                expBox.innerHTML = `<strong><i class="fas fa-info-circle"></i> स्पष्टीकरण:</strong> ${explanationText}`;
                expBox.style.display = "block";
            }
            document.getElementById('nextBtn').style.display = "inline-block";
        }

        function skipQuestion() {
            if (currentIndex < activeQuestions.length) { skipCount++; currentIndex++; loadQuestion(); }
        }
        function nextQuestion() { currentIndex++; loadQuestion(); }

        /* -------------------------------------------------------------
           4. ANALYTICS & DASHBOARD DISPLAY
           ------------------------------------------------------------- */
        function renderDashboardResults() {
            const total = activeQuestions.length;
            const attempted = correctCount + wrongCount;
            const accuracy = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;

            document.getElementById('quizBoxContent').innerHTML = `
                <div class="result-card">
                    <i class="fas fa-chart-pie" style="font-size: 2.5rem; color: var(--rsp-cyan); margin-bottom: 10px;"></i>
                    <h3 style="color:var(--text-main); font-size:1.4rem;">नतिजा विश्लेषण (Dashboard)</h3>
                    
                    <div class="accuracy-ring" style="--accuracy: ${accuracy};">
                        <span class="accuracy-value">${accuracy}%</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Accuracy Rate</p>

                    <div class="score-stats-grid">
                        <div class="stat-card correct-stat">
                            <span class="num">${correctCount}</span> सही उत्तर
                        </div>
                        <div class="stat-card wrong-stat">
                            <span class="num">${wrongCount}</span> गलत उत्तर
                        </div>
                        <div class="stat-card skip-stat">
                            <span class="num">${skipCount}</span> Skipped
                        </div>
                        <div class="stat-card total-stat">
                            <span class="num">${total}</span> कुल प्रश्न
                        </div>
                    </div>

                    <div class="result-actions">
                        <button class="bright-btn practice-btn" onclick="startQuiz('${currentMode}')">
                            <i class="fas fa-rotate-right"></i> पुनः अभ्यास गर्नुहोस् (Retry)
                        </button>
                        <button class="bright-btn mistake-btn" style="background: linear-gradient(135deg, #475569, #1E293B);" onclick="goHome()">
                            <i class="fas fa-house"></i> Dashboard Back / मुख्य पृष्ठ
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
